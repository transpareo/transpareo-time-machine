# Continuous integration: type-check, run the test
# suite, build the lib bundle, and run the browser suite
# on WebKit. Runs on every push to main and on every pull
# request.
#
# The check job runs no `npm run seed`. The seed downloads
# fixture images from upstream CDNs (Unsplash etc.) at
# runtime, so its pass/fail signal would depend on
# third-party availability. Fixture schema regressions are
# caught by `npm run check:fixtures` and by local seed
# runs before pushing. The webkit job does seed, and
# accepts that dependency in a job of its own.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; nothing here may write. Actions
# are pinned to full commit SHAs (tags are mutable; a
# re-pointed tag would run unreviewed code). Dependabot
# keeps the pins fresh; the trailing comment names the tag
# each SHA was taken from.
permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run check:fixtures
      - run: npm test
      - run: npm run build
      - run: npm run build:embed
      # Emit SRI hashes for the lib build outputs and
      # enforce the gzipped bundle-size budgets (see
      # scripts/check-bundle-size.ts for the limits).
      # The embed bundle is measured out of dist-embed/,
      # so the embed build must run before the size gate.
      - run: npm run emit:sri
      - run: npm run check:bundle-size
      # Every vendor-prefixed declaration in the bundle keeps
      # its standard form (see scripts/check-css-prefixes.ts).
      - run: npm run check:prefixes
      # Reproducible-build gate: build a second time and
      # diff the integrity manifest against the first
      # build. Runs only on Node 22 (the publish target)
      # so we don't double-build twice in the matrix.
      - if: matrix.node == '22'
        run: npm run check:reproducible

  # The browser suite on Safari's engine, the same steps the
  # release workflow gates on. WebKit's Linux build needs
  # libraries most local checkouts lack, so without this job
  # a release was the first WebKit run. The suite needs seeded
  # fixtures, so a CDN outage fails this job and leaves the
  # check job's signal alone. Chromium and Firefox stay on
  # the release path; contributors run them locally with
  # `npm run seed && npm run browser`.
  webkit:
    name: browser (webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run seed
      - run: npm run browser:webkit
      - name: upload browser test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
