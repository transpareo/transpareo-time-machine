<!doctype html>
<html lang="en">
  <head>
    <!--
      Dev shell for an UNSIGNED single snapshot: `src`
      points at the atelier-barro-vase fixture, one frozen
      version published without a manifest and without a
      proof. By default the renderer shows such a passport
      with no verification chrome at all (a DPP that never
      claimed verifiability is not badged for lacking it),
      and with no themed logo either, the whole brandbar
      collapses. Add show-verification-mark="true" to the
      element below to see the question-mark "Not
      verifiable" chip and its modal explanation instead.
      Reachable at http://localhost:5173/unsigned.html
      under `npm run dev`. No branding.css on purpose: a
      foreign DPP ships none, so the renderer's neutral
      defaults apply. Not shipped in the npm package; see
      the "Dev pages" section of the README.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Baseline Content-Security-Policy; see index.html for
      the rationale and per-deployment adjustments.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https:;
        font-src 'self' https: data:;
        img-src 'self' https: data: blob:;
        connect-src 'self' https: ws: wss:;
        object-src 'none';
        base-uri 'self';
        form-action 'self'"
    />
    <title>Transpareo Time Machine (unsigned snapshot, dev)</title>

    <style>
      .ttm-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .ttm-boot::before {
        content: '';
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid color-mix(
          in oklab, var(--font-color, #222) 20%, transparent);
        border-top-color: color-mix(
          in oklab, var(--font-color, #222) 80%, transparent);
        animation: ttm-boot-spin 0.9s linear infinite;
      }
      @keyframes ttm-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!--
      `src` is a single unsigned snapshot URL: no manifest,
      no version history, no proof to verify.
    -->
    <!--
      No footer-copyright either: this shell shows the
      renderer at its barest, exactly what a foreign
      unsigned DPP gets with zero configuration.
    -->
    <transpareo-time-machine
      src="/atelier-barro-vase/dpp/demo-2026-c001/snapshot.json">
      <div class="ttm-boot" aria-label="Loading"></div>
    </transpareo-time-machine>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
