  accordions:
    - key: studio
      label:
        en: About the studio
        de: Über die Werkstatt
        pt: Sobre o atelier
      body:
        en: Atelier Barro is a two-person pottery studio working with clay dug within 40 km of the workshop. Seconds and offcuts are reclaimed into the next batch.
        de: Atelier Barro ist eine Zwei-Personen-Töpferei, die mit Ton arbeitet, der im Umkreis von 40 km der Werkstatt gewonnen wird. Fehlbrände und Reste werden für die nächste Charge wiederaufbereitet.
        pt: O Atelier Barro é uma olaria de duas pessoas que trabalha com barro extraído num raio de 40 km da oficina. Peças com defeito e aparas são recuperadas para o lote seguinte.
    - key: glaze
      label:
        en: Firing and glaze
        de: Brand und Glasur
        pt: Cozedura e vidrado
      body:
        en: Single-fired at 1050 °C in an electric kiln powered by the studio's rooftop panels. The transparent glaze is mixed in-house from feldspar, quartz and chalk; it contains no lead and no cadmium.
        de: Einmal gebrannt bei 1050 °C in einem Elektroofen, der von den Solarpaneelen der Werkstatt gespeist wird. Die transparente Glasur wird im Haus aus Feldspat, Quarz und Kreide angemischt; sie enthält weder Blei noch Cadmium.
        pt: Cozido uma única vez a 1050 °C num forno elétrico alimentado pelos painéis solares do atelier. O vidrado transparente é preparado no próprio atelier a partir de feldspato, quartzo e cré; não contém chumbo nem cádmio.
