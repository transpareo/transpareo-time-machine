  brand: Atelier Barro
  description:
    en: Wheel-thrown vase in local terracotta clay, fired once and finished with a lead-free transparent glaze. Each piece is shaped by hand in a small studio in Alentejo, so no two are identical.
    de: Auf der Töpferscheibe gedrehte Vase aus lokalem Terrakotta-Ton, einmal gebrannt und mit einer bleifreien transparenten Glasur veredelt. Jedes Stück wird von Hand in einer kleinen Werkstatt im Alentejo geformt, daher gleicht keines dem anderen.
    pt: Vaso torneado em barro de terracota local, cozido uma vez e acabado com um vidrado transparente sem chumbo. Cada peça é moldada à mão num pequeno atelier no Alentejo, pelo que não há duas iguais.
